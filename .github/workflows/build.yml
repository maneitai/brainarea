name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bygg statisk site og verifiser output (SSG, null npm-avhengighet)
        run: |
          node app/build.js --out _ci_out
          test -f _ci_out/index.html
          test -f _ci_out/en/index.html
          test -f _ci_out/persona/index.html
          test -f _ci_out/sitemap.xml
          grep -q hreflang _ci_out/index.html
          grep -q "/brainarea/" _ci_out/en/persona/index.html
