name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build eller tom canvas
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
            touch out/.nojekyll
          else
            mkdir -p out
            echo '<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainarea</title><style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#0b0f14;color:#9fb4c7;font:16px/1.6 system-ui,sans-serif}h1{color:#e9eff5;margin:0 0 .4rem;font-weight:600}</style></head><body><div style="text-align:center"><h1>Brainarea</h1><p>Under gjenoppbygging.</p></div></body></html>' > out/index.html
            touch out/.nojekyll
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4