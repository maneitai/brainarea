name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bygg Next.js-prosjektet hvis det finnes (tomt canvas = hopp over)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm test
            npm run build
          else
            echo "Tomt canvas: ingen package.json ennaa, bygg hoppes over."
          fi