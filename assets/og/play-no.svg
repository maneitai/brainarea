<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Brainarea — test deg selv, gratis og ærlig">
<title>Brainarea — test deg selv, gratis og ærlig</title>
<rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
<rect x="0" y="620" width="1200" height="10" fill="#1d4ed8"/>
<text x="64" y="96" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#111827">Brainarea</text>
<text x="64" y="196" font-family="DejaVu Sans" font-weight="700" font-size="56" fill="#1e293b">Brainarea — test deg selv, gratis</text>
<text x="64" y="266" font-family="DejaVu Sans" font-weight="700" font-size="56" fill="#1e293b">og ærlig</text>
<text x="64" y="338" font-family="DejaVu Sans" font-size="32" fill="#374151">Gratis tester av personlighet, evner og relasjoner. Svarene dine</text>
<text x="64" y="382" font-family="DejaVu Sans" font-size="32" fill="#374151">blir i nettleseren din — ingen konto, ingenting sendes.</text>
</svg>
